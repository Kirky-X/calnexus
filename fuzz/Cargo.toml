[package]
name = "calnexus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "parser_fuzz"
path = "fuzz_targets/parser_fuzz.rs"

[[bin]]
name = "ast_depth_fuzz"
path = "fuzz_targets/ast_depth_fuzz.rs"

[[bin]]
name = "cache_key_fuzz"
path = "fuzz_targets/cache_key_fuzz.rs"

[[bin]]
name = "canonicalizer_fuzz"
path = "fuzz_targets/canonicalizer_fuzz.rs"

[[bin]]
name = "numeric_boundary_fuzz"
path = "fuzz_targets/numeric_boundary_fuzz.rs"

[[bin]]
name = "matrix_dim_fuzz"
path = "fuzz_targets/matrix_dim_fuzz.rs"

[[bin]]
name = "list_depth_fuzz"
path = "fuzz_targets/list_depth_fuzz.rs"

[dependencies]
# link_libfuzzer 提供 libFuzzer 运行时与 main（#![no_main] 目标必需）；
# 关闭默认特性后必须显式启用，否则 7 个目标均以 "undefined symbol: main" 链接失败
libfuzzer-sys = { version = "0.4", default-features = false, features = ["link_libfuzzer"] }
calnexus = { path = ".." }
