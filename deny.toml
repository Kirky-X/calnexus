# cargo-deny 配置：许可证/漏洞/重复依赖治理
# 文档：https://embarkstudios.github.io/cargo-deny/

[graph]
# wasm 目标暂不支持（tokio rt），排除相关目标避免误报
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
ignore = [
    # pin-utils：unmaintained 标记（非漏洞）。仅 dev 依赖链引入：
    # expectrl 0.9.0（REPL 集成测试）→ {ptyprocess, nix 0.26} → pin-utils，
    # 不进任何生产 feature 的依赖图；expectrl 0.9.0 已是 crates.io 最新版，
    # 无上游补丁。退出条件与逐条理由见 .cargo/audit.toml 同 ID 注释块。
    { id = "RUSTSEC-2026-0441", reason = "dev-only chain via expectrl/ptyprocess/nix; no upstream fix, expectrl 0.9.0 is latest" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
