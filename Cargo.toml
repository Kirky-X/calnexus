[package]
name = "calnexus"
version = "0.2.0-rc.1"
edition = "2024"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "MIT"
# MSRV 与 base 生态一致基线对齐（sdforge 0.5.0-rc 系要求 1.97.1；CI msrv 任务同步）
rust-version = "1.97.1"
description = "A command-line math expression evaluator with 11 core and 4 optional (numerical/time/unit/fx) computation domains, symbolic calculus, REPL, batch processing, HTTP and MCP servers"
keywords = ["math", "calculator", "symbolic", "repl", "cli"]
categories = ["command-line-utilities", "mathematics", "science"]
repository = "https://github.com/kirky-x/calnexus"
readme = "README.md"

[features]
default = []
# CLI: 命令行界面 + REPL + 批处理（clap 通过 sdforge/cli 间接启用）
cli = ["dep:sdforge", "sdforge/cli", "dep:rustyline", "dep:rayon"]
# ICU4X: 国际化错误消息（中英双语）
icu = ["dep:icu"]
# HTTP: HTTP API 接口；sdforge/health 健康探针（/health /ready /live + ReadinessCheck）
# sdforge/context 请求标识传播（context_middleware）
http = ["dep:sdforge", "sdforge/http", "sdforge/graceful", "sdforge/health", "sdforge/context", "dep:axum", "dep:async-trait", "tokio/rt-multi-thread", "tokio/net", "tokio/io-util", "tokio/time", "tokio/signal"]
# MCP: Model Context Protocol 接口（基于 sdforge/mcp）
mcp = ["dep:sdforge", "sdforge/mcp", "dep:anyhow", "tokio/rt-multi-thread", "tokio/io-util", "tokio/time"]
# Time: 时间计算（日期差、时间戳、格式解析，feature 门控）
time = ["dep:jiff"]
# Unit: 物理单位换算（8 量纲，feature 门控）
unit = []
# FX: 汇率换算（frankfurter.dev API + 本地缓存）
fx = ["dep:ureq", "dep:dirs", "dep:limiteron"]
# Numerical: 高级数值计算（eig/SVD 等）
numerical = []
server = ["http", "mcp"]
# Ratelimit: HTTP 限流中间件（sdforge/ratelimit-http：RateLimitLayer + HttpRequestRateLimiter 契约；
# 策略为 src/server/ratelimit.rs 固定窗口，经 Clone 桥接层挂载，CALNEXUS_RATELIMIT_* 可配）
ratelimit = ["dep:sdforge", "sdforge/ratelimit-http", "dep:limiteron"]
# Docs: OpenAPI + Swagger UI 自动生成（sdforge/docs）
docs = ["dep:sdforge", "sdforge/docs"]
# Observability: tracing 日志（server 模式 EnvFilter 消费 RUST_LOG）
observability = ["dep:tracing", "dep:inklog", "tokio/rt-multi-thread"]

[dependencies]
# 解析器
mathexpr = { version = "0.1", default-features = false }
# 缓存层（oxcache byte-weight：同步字节权重预算 + try_get_with single-flight；
# 禁用默认特性避免 tokio/redis 等后端栈；键生成与 EvalResult 体积估算留在 src/core/cache.rs）
oxcache = { version = "0.5.0-rc.5", default-features = false, features = ["byte-weight"] }
# 错误派生
thiserror = { version = "2.0", default-features = false }
# 哈希
blake3 = { version = "1.8", default-features = false, features = ["std"] }
# 序列化
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
# tokio 运行时
tokio = { version = "1.53", default-features = false, features = ["rt"] }
# 正则表达式
regex = { version = "1.13", default-features = false, features = ["std", "unicode-perl"] }
# 数值计算（均禁用默认特性）
num-complex = { version = "0.4", default-features = false, features = ["std", "serde"] }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
# num-bigint: 锁定 0.4——num-rational 0.4.2（最新）固定 ^0.4，且 precision.rs 跨库传递 BigInt 类型，0.5 会破坏 BigRational 互操作
num-bigint = { version = "0.5", default-features = false, features = ["std", "serde"] }
num-rational = { version = "0.4", default-features = false, features = ["std", "serde", "num-bigint"] }
num-integer = { version = "0.1", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
# CLI 依赖（clap 通过 sdforge/cli 间接启用，features 由 sdforge 管理）
rustyline = { version = "18.0", default-features = false, features = ["derive"], optional = true }
rayon = { version = "1.12", default-features = false, optional = true }
# ICU4X 国际化
icu = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
# Fluent 消息目录（specmark change unify-rust-i18n：concurrent FluentBundle 双束承载 FTL，
# locales/{en,zh}/messages.ftl 经 include_str! 内嵌；concurrent 变体为 Send+Sync 可入 static）
fluent-bundle = "0.16"
# Fluent 语言标识（束构建用 LanguageIdentifier）
unic-langid = "0.9"
# 系统语言探测（检测链第 4 级：CALNEXUS_LANG → LC_ALL → LC_MESSAGES → LANG → sys-locale → en）
sys-locale = "0.3"
# sdforge: CLI/HTTP/MCP 接口封装层
sdforge = { version = "0.5.0-rc.5", default-features = false, optional = true }
# axum: HTTP 框架（与 sdforge 0.8 同版本，仅 http feature 启用；获取 Router 类型用于 build_router）
axum = { version = "0.8", default-features = false, optional = true }
# serde_json: JSON 序列化（核心依赖：EvalResult::Json 复合返回变体 + server 模块共用）
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# anyhow: 错误上下文（sdforge 0.4.2 #[forge] MCP codegen 硬依赖 anyhow::anyhow!/anyhow::Error；仅 mcp feature 启用）
anyhow = { version = "1.0", default-features = false, features = ["std"], optional = true }
# async-trait: HealthChecker trait 实现（sdforge health-check 依赖 async_trait 宏；仅 http feature 启用）
async-trait = { version = "0.1", default-features = false, optional = true }
# tracing: observability 支持（server 模式结构化日志；仅 observability feature 启用）
tracing = { version = "0.1", default-features = false, optional = true }
# 生产日志（observability feature）：inklog 接管，tokio 经本 feature 门控进入
# （CLI 纯构建不含 observability，保持 tokio-free 轻量化设计）
inklog = { version = "0.3.0-rc.5", default-features = false, optional = true }
# jiff: 日期时间库（tzdb-bundle-always 内嵌 IANA tzdb，跨平台一致；仅 time feature 启用）
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"], optional = true }
# ureq: 同步 HTTP 客户端（rustls TLS，无 tokio 耦合；仅 fx feature 启用）
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
# dirs: 跨平台缓存目录（仅 fx feature 启用；7.0 为最新稳定 major，API 兼容仅用 cache_dir）
dirs = { version = "7.0", default-features = false, optional = true }
# limiteron: 同步限流原语（sync = tokio-free 熔断器/固定窗口；default = []，仅 std + parking_lot）。
# fx feature 消费 SyncCircuitBreaker（汇率源熔断），ratelimit feature 消费 SyncFixedWindowLimiter
limiteron = { version = "0.3.0-rc.5", default-features = false, features = ["sync"], optional = true }

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
assert_cmd = { version = "2.2", default-features = false }
predicates = { version = "3.1", default-features = false }
tempfile = { version = "3.27", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
insta = { version = "1.48", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["plotters"] }
expectrl = { version = "0.9", default-features = false }
# tower: HTTP 集成测试用（ServiceExt::oneshot 测试 axum Router）
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = { version = "0.1", default-features = false }

[lints.rust]
# check-cfg: sdforge #[forge] 宏总会 emit `#[cfg(feature="openapi")]` / `#[cfg(feature="observability")]` gate，
# 但 CalNexus 不启用这些 feature。声明这些值为合法 cfg 以消除 unexpected_cfgs warning。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(feature, values("openapi"))', 'cfg(feature, values("observability"))'] }

[[bench]]
name = "parser_bench"
harness = false
required-features = ["cli"]

[[bench]]
name = "cache_bench"
harness = false
required-features = ["cli"]

[[bench]]
name = "domain_bench"
harness = false
required-features = ["cli"]

[[bench]]
name = "api_bench"
harness = false

[[test]]
name = "cli_integration"
required-features = ["cli"]

[[test]]
name = "repl_integration"
required-features = ["cli"]

[[test]]
name = "property_tests"
required-features = ["cli"]

[[test]]
name = "security_tests"
required-features = ["cli"]

[[test]]
name = "snapshot_tests"
required-features = ["cli"]

[[test]]
name = "performance_tests"
required-features = ["cli"]

[[test]]
name = "integration"
required-features = ["cli"]

[[test]]
name = "server_http_integration"
required-features = ["server"]

[[test]]
name = "server_mcp_integration"
required-features = ["server"]

[[test]]
name = "time_unit_fx_integration"
required-features = ["cli", "time", "unit", "fx"]

[[test]]
name = "numerical_linalg_test"
required-features = ["cli", "numerical"]

# E2E 场景套件（specmark change: e2e-scenario-suite）：
# 无 required-features —— 目标在一切 feature 组合下编译，内部 #[cfg] 门控
# 启用/禁用两侧用例（--all-features 跑启用侧，default 跑禁用侧）。
[[test]]
name = "e2e"
