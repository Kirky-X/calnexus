[package]
name = "calnexus"
version = "0.2.0-rc.2"
edition = "2024"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "MIT"
# MSRV 与 base 生态一致基线对齐（sdforge 0.5.0-rc 系要求 1.97.1；CI msrv 任务同步）
rust-version = "1.97.1"
description = "A command-line math expression evaluator with 11 core and 3 optional (time/unit/fx) computation domains plus a numerical-linalg feature, symbolic calculus, REPL, batch processing, HTTP and MCP servers"
keywords = ["math", "calculator", "symbolic", "repl", "cli"]
categories = ["command-line-utilities", "mathematics", "science"]
repository = "https://github.com/kirky-x/calnexus"
readme = "README.md"

[features]
default = []
# CLI: 命令行界面 + REPL + 批处理（clap 通过 sdforge/cli 间接启用）
cli = ["dep:sdforge", "sdforge/cli", "dep:rustyline", "dep:rayon"]
# ICU4X: 国际化错误消息（中英双语）
icu = ["dep:icu"]
# HTTP: HTTP API + sdforge 健康探针（/health /ready /live）与请求标识传播
http = ["dep:tokio", "dep:sdforge", "sdforge/http", "sdforge/graceful", "sdforge/health", "sdforge/context", "sdforge/metrics", "dep:axum", "dep:async-trait", "tokio/rt-multi-thread", "tokio/net", "tokio/io-util", "tokio/time", "tokio/signal"]
# MCP: Model Context Protocol 接口（基于 sdforge/mcp）
mcp = ["dep:tokio", "dep:sdforge", "sdforge/mcp", "dep:anyhow", "tokio/rt-multi-thread", "tokio/io-util", "tokio/time"]
# Time: 时间计算（日期差、时间戳、格式解析，feature 门控）
time = ["dep:jiff"]
# Unit: 物理单位换算（8 量纲，feature 门控）
unit = []
# FX: 汇率换算（frankfurter.dev API + 本地缓存）
fx = ["dep:ureq", "dep:dirs", "dep:limiteron", "dep:confers"]
# Numerical: 高级数值计算（eig/SVD 等）
numerical = []
server = ["http", "mcp"]
# Ratelimit: HTTP 固定窗口限流（sdforge/ratelimit-http；CALNEXUS_RATELIMIT_* 可配）
ratelimit = ["dep:sdforge", "sdforge/ratelimit-http", "dep:limiteron"]
# Docs: OpenAPI + Swagger UI 自动生成（sdforge/docs）
docs = ["dep:sdforge", "sdforge/docs"]
# Observability: tracing/inklog 日志（server 模式，RUST_LOG；tokio 由 http/mcp 提供）
observability = ["dep:tracing", "dep:inklog"]
# wasm-api: wasm-bindgen 导出层（仅 wasm32 目标；非 wasm 启用会编译期报错）
wasm-api = ["dep:wasm-bindgen"]
# egraph: 基于 egg 的 equality saturation 化简（默认关闭）
egraph = ["dep:egg"]

[dependencies]
# 解析器
mathexpr = { version = "0.1", default-features = false }
# 缓存层：oxcache byte-weight（同步字节预算）+ serialization（L1 weigher 估重）
oxcache = { version = "0.5.0-rc.10", default-features = false, features = ["byte-weight", "serialization"] }
# 错误派生
thiserror = { version = "2.0", default-features = false }
# 哈希
blake3 = { version = "1.8", default-features = false, features = ["std"] }
# 序列化
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
# tokio 运行时（仅 http/mcp 的 server 模块；optional 避免 wasm32 特性限制编译错误）
tokio = { version = "1.53", default-features = false, features = ["rt"], optional = true }
# 正则表达式
regex = { version = "1.13", default-features = false, features = ["std", "unicode-perl"] }
# libm: 纯 Rust fdlibm 移植（J/Y Bessel 族，零传递依赖，wasm 可用）
libm = { version = "0.2", default-features = false }
# 数值计算（均禁用默认特性）
num-complex = { version = "0.4", default-features = false, features = ["std", "serde"] }
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
# num-bigint 锁 0.4：num-rational 固定 ^0.4，0.5 会破坏 BigRational 互操作
num-bigint = { version = "0.4", default-features = false, features = ["std", "serde"] }
num-rational = { version = "0.4", default-features = false, features = ["std", "serde", "num-bigint"] }
num-integer = { version = "0.1", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }
# CLI 依赖（clap 通过 sdforge/cli 间接启用，features 由 sdforge 管理）
rustyline = { version = "18.0", default-features = false, features = ["derive"], optional = true }
rayon = { version = "1.12", default-features = false, optional = true }
# ICU4X 国际化
icu = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
# Fluent 消息束：locales/{en,zh}/messages.ftl 经 include_str! 内嵌（concurrent 可入 static）
fluent-bundle = { version = "0.16", default-features = false }
# Fluent 语言标识（束构建用 LanguageIdentifier；default = []，无需额外特性）
unic-langid = { version = "0.9", default-features = false }
# 系统语言探测：CALNEXUS_LANG → LC_ALL → LC_MESSAGES → LANG → sys-locale → en
sys-locale = { version = "0.3", default-features = false }
# sdforge: CLI/HTTP/MCP 接口封装层
sdforge = { version = "0.5.0-rc.8", default-features = false, optional = true }
# axum: HTTP 框架（仅 http；Router 类型用于 build_router）
axum = { version = "0.8", default-features = false, optional = true }
# serde_json: JSON 序列化（EvalResult::Json + server 共用）
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# anyhow: MCP codegen 错误上下文（#[forge] 硬依赖；仅 mcp feature）
anyhow = { version = "1.0", default-features = false, features = ["std"], optional = true }
# async-trait: HealthChecker trait 实现（sdforge health-check 依赖 async_trait 宏；仅 http feature 启用）
async-trait = { version = "0.1", default-features = false, optional = true }
# tracing: observability 支持（server 模式结构化日志；仅 observability feature 启用）
tracing = { version = "0.1", default-features = false, optional = true }
# 生产日志（observability）：inklog 接管，CLI 纯构建保持 tokio-free
inklog = { version = "0.3.0-rc.9", default-features = false, optional = true }
# jiff: 日期时间库（tzdb-bundle-always 内嵌 IANA tzdb，跨平台一致；仅 time feature 启用）
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"], optional = true }
# ureq: 同步 HTTP 客户端（rustls TLS，无 tokio 耦合；仅 fx feature 启用）
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
# dirs: 跨平台缓存目录（仅 fx；7.x 稳定，仅用 cache_dir）
dirs = { version = "7.0", default-features = false, optional = true }
# limiteron: 同步限流原语（sync 特性：熔断 + 固定窗口；fx/ratelimit 共用）
limiteron = { version = "0.3.0-rc.7", default-features = false, features = ["sync"], optional = true }
# confers: 声明式配置（fx 域 CALNEXUS_FX_* 经 env_prefix 映射；无 dotenvy/toml）
confers = { version = "0.6.0-rc.10", default-features = false, optional = true }
# wasm-bindgen: wasm32 导出层（仅 wasm-api feature 启用）
wasm-bindgen = { version = "0.2", default-features = false, optional = true }
# egg: E-graph equality saturation（仅 egraph feature 启用）
egg = { version = "0.9", default-features = false, optional = true }

# SIGPIPE 恢复默认处置：`| head` 提前关管道时静默终止而非 EPIPE panic（仅 unix）
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
assert_cmd = { version = "2.2", default-features = false }
predicates = { version = "3.1", default-features = false }
tempfile = { version = "3.27", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
insta = { version = "1.49", default-features = false }
criterion = { version = "0.8", default-features = false, features = ["plotters"] }
expectrl = { version = "0.9", default-features = false }
# tower: HTTP 集成测试用（ServiceExt::oneshot 测试 axum Router）
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = { version = "0.1", default-features = false }

[lints.rust]
# check-cfg: #[forge] 会 emit openapi/observability cfg，本 crate 未启用，声明以消除 warning
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(feature, values("openapi"))', 'cfg(feature, values("observability"))'] }

[[bench]]
name = "parser_bench"
harness = false
required-features = ["cli"]

[[bench]]
name = "cache_bench"
harness = false
required-features = ["cli"]

[[bench]]
name = "domain_bench"
harness = false
required-features = ["cli"]

[[bench]]
name = "api_bench"
harness = false

[[test]]
name = "cli_integration"
required-features = ["cli"]

[[test]]
name = "repl_integration"
required-features = ["cli"]

[[test]]
name = "property_tests"
required-features = ["cli"]

[[test]]
name = "security_tests"
required-features = ["cli"]

[[test]]
name = "snapshot_tests"
required-features = ["cli"]

[[test]]
name = "performance_tests"
required-features = ["cli"]

[[test]]
name = "integration"
required-features = ["cli"]

[[test]]
name = "server_http_integration"
required-features = ["server"]

[[test]]
name = "server_mcp_integration"
required-features = ["server"]

[[test]]
name = "time_unit_fx_integration"
required-features = ["cli", "time", "unit", "fx"]

[[test]]
name = "numerical_linalg_test"
required-features = ["cli", "numerical"]

# E2E 场景套件：无 required-features，内部 #[cfg] 门控启用/禁用两侧用例
[[test]]
name = "e2e"

# 本地 oxcache（含 wasm32 支持、待发布）开发用；发布后删除本段并 `cargo update -p oxcache`。
[patch.crates-io]
oxcache = { path = "../base/oxcache" }
