version: 2
updates:
  # GitHub Actions 周更（v015 T049：actions SHA 钉扎的配套更新机制）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # patch 级版本更新关闭自动 PR（2026-11-16）
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
  # Rust 依赖周更
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # patch 级版本更新关闭自动 PR（2026-11-16）
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
