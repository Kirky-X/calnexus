name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.4)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

# 架构 M-2：防止并发 release 导致缓存冲突 / crates.io 发布顺序不可控
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # 安全 LOW-1 / 架构 L-2：permissions 收窄到 job 级别，最小权限原则
    # id-token: write：crates.io trusted publishing（OIDC）换取短时发布凭证
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 架构 H-2：支持 workflow_dispatch 手动触发，publish 失败时可重试
      - name: Extract version from tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          # 安全 H-1：版本号白名单校验，防止表达式注入（拒绝 shell 元字符）
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "ERROR: invalid version format: $VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted tag: $TAG"
          echo "Extracted version: $VERSION"

      # semver 预发布段（-rc.N 等）→ GitHub prerelease 标记；rc 不得抢占 Latest
      - name: Derive prerelease flag
        id: meta
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      # 架构 M-1 / 性能 M-1：版本验证前移，fail-fast 节约 CI 资源
      - name: Verify Cargo.toml version matches tag
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          CARGO_VERSION=$(awk -F'"' '/^version = "/{print $2; exit}' Cargo.toml)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: tag version ($TAG_VERSION) != Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 性能 H-1：用 arduino/setup-protoc@v3 替代 apt-get update（10-20s → 1-2s）
      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # 安全 M-2：发布前 SAST 扫描（规则24：0 CRITICAL 才允许继续）
      - name: Install cargo-audit
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit --deny warnings

      # 架构 H-1 / M-3：publish 前做 dry-run 验证（包含完整构建，CI 已跑测试）
      # 必须在 create archives 之前：cargo publish 拒绝 working directory 有未提交文件
      - name: Verify package builds
        run: cargo publish --dry-run

      # 幂等:已发布版本直接跳过,避免重跑时"already exists"报错
      - name: Check already published
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
            "https://crates.io/api/v1/crates/calnexus/${VERSION}")
          echo "calnexus ${VERSION}: HTTP ${CODE}"
          echo "exists=$([[ "$CODE" == "200" ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      # crates.io trusted publishing（OIDC）：官方 auth-action 以 Actions OIDC 换取短时发布凭证
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: auth

      # 性能 H-2：-v 提供进度反馈，避免日志黑屏 45s 像 hang 死
      # crates.io 是事实发布，必须在 GitHub Release 之前
      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -v

      # Release 只带 GitHub 自动生成的源码压缩包,不附自制 archive/校验和产物。
      # 幂等：softprops 对同 tag 已有 release 为 upsert 语义（重跑改写而非新建），
      # 随后 uniqueness 断言钉住恰好 1 个。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.PRERELEASE }}

      # TAG 取自 extract 步（与创建步同源）：手动触发时 GITHUB_REF 是分支 ref，
      # 按 GITHUB_REF 剥前缀会得到错误 tag 导致断言误报
      - name: Verify release uniqueness (idempotency guard)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          echo "release objects for ${TAG}: ${COUNT}"
          if [ "${COUNT}" != "1" ]; then
            echo "::error::expected exactly 1 release for ${TAG}, found ${COUNT}; release state is not idempotent"
            exit 1
          fi
