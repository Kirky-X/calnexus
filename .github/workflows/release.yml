name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.4)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

# 架构 M-2：防止并发 release 导致缓存冲突 / crates.io 发布顺序不可控
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    # 安全 LOW-1 / 架构 L-2：permissions 收窄到 job 级别，最小权限原则
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 架构 H-2：支持 workflow_dispatch 手动触发，publish 失败时可重试
      - name: Extract version from tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          # 安全 H-1：版本号白名单校验，防止表达式注入（拒绝 shell 元字符）
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "ERROR: invalid version format: $VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted tag: $TAG"
          echo "Extracted version: $VERSION"

      # 架构 M-1 / 性能 M-1：版本验证前移，fail-fast 节约 CI 资源
      - name: Verify Cargo.toml version matches tag
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          CARGO_VERSION=$(awk -F'"' '/^version = "/{print $2; exit}' Cargo.toml)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: tag version ($TAG_VERSION) != Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 性能 H-1：用 arduino/setup-protoc@v3 替代 apt-get update（10-20s → 1-2s）
      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc56dabe9d744d # v2.7.5

      # 安全 M-2：发布前 SAST 扫描（规则24：0 CRITICAL 才允许继续）
      - name: Install cargo-audit
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit --deny warnings

      # 架构 H-1 / M-3：publish 前做 dry-run 验证（包含完整构建，CI 已跑测试）
      # 必须在 create archives 之前：cargo publish 拒绝 working directory 有未提交文件
      - name: Verify package builds
        run: cargo publish --dry-run

      # 性能 H-2：-v 提供进度反馈，避免日志黑屏 45s 像 hang 死
      # crates.io 是事实发布，必须在 GitHub Release 之前
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -v

      # 安全 H-1：env 注入而非 ${{ }} 字符串展开；性能 M-3：两次 archive 并行
      # 在 publish 之后：publish 失败时不创建 archives，可无成本重试
      - name: Create source archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git archive --format=tar.gz --prefix=calnexus-${VERSION}/ -o "calnexus-${VERSION}.tar.gz" "$TAG" &
          git archive --format=zip --prefix=calnexus-${VERSION}/ -o "calnexus-${VERSION}.zip" "$TAG" &
          wait

      - name: Generate SHA256 checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sha256sum "calnexus-${VERSION}.tar.gz" "calnexus-${VERSION}.zip" > "calnexus-${VERSION}-sha256sums.txt"
          echo "Checksums:"
          cat "calnexus-${VERSION}-sha256sums.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            calnexus-${{ steps.version.outputs.version }}.tar.gz
            calnexus-${{ steps.version.outputs.version }}.zip
            calnexus-${{ steps.version.outputs.version }}-sha256sums.txt

  # v015 T052（R-rel-001）：多平台预编译二进制（publish 成功后构建，失败不阻塞源码发布）
  binaries:
    name: Binary (${{ matrix.target }})
    needs: release
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --features cli,time,unit,fx --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          DIR="calnexus-${VERSION}-${{ matrix.target }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/calnexus" "$DIR/"
          cp README.md LICENSE "$DIR/"
          tar czf "${DIR}.tar.gz" "$DIR"
          sha256sum "${DIR}.tar.gz" >> "sha256sums-${VERSION}.txt"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ inputs.tag || github.ref_name }}"
          $dir = "calnexus-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "$dir" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/calnexus.exe" "$dir/"
          Copy-Item README.md, LICENSE "$dir/"
          Compress-Archive -Path "$dir" -DestinationPath "$dir.zip"
      - name: Upload to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            calnexus-*-${{ matrix.target }}.${{ matrix.archive }}
            sha256sums-*.txt
