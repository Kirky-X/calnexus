name: Feature Matrix

# 单特性 × --all-targets 全量矩阵（cargo hack）：捕获「某 feature 单独开启即不可编译」类裂缝。
# 每周定时 + 手动触发；PR 门禁由 ci.yml 的 curated 组合矩阵兜底（逐特性全量跑成本高于收益）。
on:
  schedule:
    - cron: "41 5 * * 1" # 每周一 05:41 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  each-feature:
    name: cargo hack --each-feature
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-hack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-hack
      - name: Check each feature alone
        # wasm-api 仅 wasm32 可用（非 wasm 启用会 compile_error），矩阵中排除
        run: cargo hack check --each-feature --exclude-features wasm-api --all-targets
