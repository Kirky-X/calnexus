name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - cli
          - cli,server
          - all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run clippy (${{ matrix.features }})
        run: |
          if [ "${{ matrix.features }}" = "all" ]; then
            # wasm-api 仅 wasm32 可用（非 wasm 启用会 compile_error），从 all 腿排除
            cargo clippy --features "cli,server,time,unit,fx,numerical,ratelimit,docs,observability,icu,egraph" --all-targets -- -D warnings
          else
            cargo clippy --features ${{ matrix.features }} --all-targets -- -D warnings
          fi

  test:
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - cli
          - cli,time,unit,fx
          - cli,server
          - cli,server,fx
          - cli,numerical
          - all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests (${{ matrix.features }})
        run: |
          if [ "${{ matrix.features }}" = "all" ]; then
            # wasm-api 仅 wasm32 可用，从 all 腿排除
            cargo test --features "cli,server,time,unit,fx,numerical,ratelimit,docs,observability,icu,egraph"
          else
            cargo test --features "${{ matrix.features }}"
          fi
      - name: Check single features
        run: |
          cargo check --features time
          cargo check --features unit
          cargo check --features fx
          cargo check --features numerical

  msrv:
    name: MSRV (1.97.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check with MSRV
        # wasm-api 仅 wasm32 可用，MSRV 检查排除
        run: cargo check --features "cli,server,time,unit,fx,numerical,ratelimit,docs,observability,icu,egraph"

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build release
        run: cargo build --release --features cli

  # wasm32 构建门禁：只覆盖 lib+bins。测试/基准目标依赖的 dev-dependencies
  # （getrandom 0.4 等）需要 wasm_js 特性，不在本 job 承诺范围。
  wasm32:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build (no default features)
        run: cargo build --lib --bins --target wasm32-unknown-unknown --no-default-features
      - name: Build (cli)
        run: cargo build --lib --bins --target wasm32-unknown-unknown --features cli
      - name: Build (cli,wasm-api)
        run: cargo build --lib --target wasm32-unknown-unknown --features cli,wasm-api
      - name: Clippy (wasm32, cli)
        run: cargo clippy --target wasm32-unknown-unknown --features cli -- -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov
      - name: Run coverage
        run: cargo llvm-cov --features "cli,time,unit,fx" --fail-under-lines 90 --summary-only
